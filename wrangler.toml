# =======================================================================================================
# 1. Cloudflare Worker 基础配置
# =======================================================================================================

# Worker 服务名称（在 Cloudflare Dashboard 中显示的项目名）
name = 'possineo'

# 项目的主入口文件名
main = "_worker.js"

# 兼容性日期：决定 Cloudflare 运行时环境的特性与行为版本
compatibility_date = "2025-11-04"

# 环境变量保护：true 表示每次用 wrangler 部署时，不会覆盖或删除在网页控制台上手动设置的环境变量
keep_vars = true


# =======================================================================================================
# 2. 域名访问控制（注意：顶层配置必须写在 [[表块]] 之前）
# =======================================================================================================

# 禁用生产环境默认分配的域名 (possineo.iuniversus.workers.dev)
workers_dev = false

# 禁用分支预览部署时自动生成的域名 (*-possineo.iuniversus.workers.dev)
preview_urls = false


# =======================================================================================================
# 3. 可观察性配置 (Observability：包含日志与链路追踪)
# =======================================================================================================

# Observability 总设置
[observability]
enabled = true              # 开启可观察性功能
head_sampling_rate = 1      # 整体采样率：1 表示 100% 记录（取值 0 到 1，例如 0.5 代表 50%）
redact_query_string = false # 是否脱敏 URL 参数：false 表示在日志中完整保留请求参数（如 ?token=xxx）

# Workers Logs（运行日志设置）
[observability.logs]
enabled = true              # 开启日志收集
head_sampling_rate = 1      # 日志采样率：100%
invocation_logs = true      # 记录函数调用与 console.log 输出
persist = true              # 保存日志，以便在 Dashboard 的 Observability -> Logs 页面查阅

# Workers Traces（链路追踪设置）
[observability.traces]
enabled = true              # 开启链路追踪
head_sampling_rate = 1      # 追踪采样率：100%
persist = true              # 保存追踪记录，以便在 Dashboard 的 Observability -> Traces 页面查阅


# =======================================================================================================
# 4. 外部资源绑定（必须放在文件最底部！）
# 注：[[...]] 属于 TOML 表数组，下方写的所有属性都会被归为该资源下的参数
# =======================================================================================================

# KV 数据库绑定
[[kv_namespaces]]
binding = "KV"                           # 代码中调用的变量名（如 env.KV.get(...)）
id = "49fcc7cb38a0474cb4f9684d7d8706dc"   # 对应的 Cloudflare KV 空间 ID
