# wrangler.toml
name = 'possineo'
main = "_worker.js"
compatibility_date = "2025-11-04"
keep_vars = true

# ===============================================================
# 以下禁用 Worker URL —— .workers.dev
# ===============================================================
# 禁用 Production 的 *.workers.dev 域名
workers_dev = false
# 禁用 Preview / 分支部署自动生成的预览域名
preview_urls = false


# ===============================================================
# 绑定配置（本子块统一放在最下方）
# 以下每次更新应用时，自动绑定KV空间
# ===============================================================
[[kv_namespaces]]
binding = "KV"			                          #KV绑定名默认不可修改。
id = "49fcc7cb38a0474cb4f9684d7d8706dc"       #KV数据库id。
