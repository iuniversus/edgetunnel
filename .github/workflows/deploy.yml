name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # 支持在 GitHub 网页手动点击触发部署

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取仓库代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node_version: 20

      # 3. 在构建服务器上动态将 Secrets 注入 wrangler.toml
      - name: Inject Secrets into wrangler.toml
        run: |
          sed -i 's/WORKER_NAME_PLACEHOLDER/'"${{ secrets.CF_WORKER_NAME }}"'/g' wrangler.toml
          sed -i 's/KV_ID_PLACEHOLDER/'"${{ secrets.CF_KV_ID }}"'/g' wrangler.toml

      # 4. 执行 Wrangler 部署
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy
